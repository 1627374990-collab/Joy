<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<meta name="description" content="SCC Patrol Record - 历史查询与PDF导出">
<title>历史查询</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCC Patrol">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: auto;
    touch-action: manipulation;
  }
  /* iOS：只对输入框去除原生外观，date/select 保留可点击区域 */
  input[type=text], input[type=number], textarea {
    -webkit-appearance: none; appearance: none;
  }
  input[type=date] {
    -webkit-appearance: none; appearance: none;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background-color: #fff;
  }
  /* 所有可点击元素：最小 44px 热区（HIG）*/
  .btn, button, .back-btn, select {
    min-height: 44px !important;
  }
  .settings-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  /* 返回按钮：放大、实心背景（与 settings.html 保持一致）*/
  .back-btn {
    font-size: 20px;
    font-weight: 700;
    padding: 0 16px;
    min-width: 56px;
    min-height: 44px;
    background: #ffffff;
    color: #1976d2;
    border-radius: 12px;
    border: 1px solid #bbdefb;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: rgba(25,118,210,0.15);
  }
  .back-btn:active { background: #e3f2fd; transform: scale(0.97); }
</style>
<link rel="stylesheet" href="styles.css?v=170">
</head>
<body>
<header class="app-header">
  <div class="settings-header">
    <button id="btn-back" class="back-btn">←</button>
    <h1>历史查询</h1>
  </div>
</header>

<main>
  <section class="history-controls">
    <div class="date-range">
      <label>日期范围</label>
      <div class="date-inputs">
        <input type="date" id="date-start" class="date-input">
        <span class="date-sep">至</span>
        <input type="date" id="date-end" class="date-input">
      </div>
    </div>
    <div class="control-actions">
      <button id="btn-search" class="btn btn-primary">🔍 查询</button>
      <button id="btn-export-range" class="btn btn-outline">📄 导出PDF</button>
      <button id="btn-clear-history" class="btn btn-sm btn-danger">🗑 清除全部历史</button>
    </div>
  </section>

  <!-- 一键导出习惯 -->
  <section class="history-controls quick-export-section">
    <div class="quick-export-row">
      <label class="quick-export-label">⚡ 一键导出习惯</label>
      <div class="quick-export-opts">
        <select id="quick-export-start" class="quick-export-select"></select>
        <span class="date-sep">至</span>
        <select id="quick-export-end" class="quick-export-select"></select>
        <button id="btn-quick-export" class="btn btn-primary">⚡ 导出</button>
      </div>
    </div>
    <div class="range-display" style="margin-top:6px;color:#888;font-size:12px;">选择起始日和结束日（最早可选上上周一），点击导出即可生成该范围的PDF。</div>
  </section>

  <section class="history-summary" id="history-summary">
    <div class="summary-item">
      <span class="summary-label">查询日期</span>
      <span class="summary-value" id="summary-date">--</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">记录天数</span>
      <span class="summary-value" id="summary-days">0</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">完成率</span>
      <span class="summary-value" id="summary-rate">0%</span>
    </div>
  </section>

  <section class="history-list" id="history-list">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📋</div>
      <p>选择日期范围后点击"查询"</p>
    </div>
  </section>
</main>

<!-- Confirm Dialog -->
<div id="action-dialog" class="dialog-overlay hidden">
  <div class="dialog">
    <h3 id="dialog-title">确认</h3>
    <p id="dialog-message">确定要执行此操作吗？</p>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn btn-secondary">取消</button>
      <button id="dialog-confirm" class="btn btn-danger">确认</button>
    </div>
  </div>
</div>

<script src="history.js?v=170"></script>

<!-- iOS PWA standalone 模式下保持站内跳转不跳出到 Safari + SW 注册 -->
<script>
if (('standalone' in window.navigator) && window.navigator.standalone) {
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a');
    if (!a || !a.getAttribute('href')) return;
    var href = a.getAttribute('href');
    if (href.indexOf('://') === -1 && !href.startsWith('#') && !a.target) {
      e.preventDefault();
      window.location.href = href;
    }
  }, false);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(function () {});
  });
}
</script>
</body>
</html>
