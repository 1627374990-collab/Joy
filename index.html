<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<meta name="description" content="每小时状态巡检打卡记录应用（GMT时间），支持勾叉状态、Note备注、异常高亮、整点提醒与PDF导出">
<title>状态记录 · 今日</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS Safari 专属标签 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="状态记录">
<meta name="format-detection" content="telephone=no">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS 主屏图标（iPhone / iPad Pro 全尺寸） -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="76x76" href="icons/icon-72.png">
<link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72.png">

<!-- 通用图标 -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="shortcut icon" type="image/png" href="icons/icon-192.png">

<!-- iOS 启动图（Splash Screen）按尺寸声明 -->
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/icon-512.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/icon-512.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/icon-512.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/icon-512.png">
<link rel="apple-touch-startup-image" media="(orientation: portrait)" href="icons/icon-512.png">

<link rel="stylesheet" href="styles.css?v=140">

<!-- PWA 全局预留样式（iOS 刘海区安全内边距 / 不显示滚动条 / 原生手势） -->
<style>
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .table-wrapper { overscroll-behavior-x: contain; }
  textarea, input { -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<header class="app-header">
  <h1>今日状态记录</h1>
  <div class="header-actions">
    <span id="gmt-clock" class="gmt-clock">--:-- GMT</span>
    <button id="btn-history" class="icon-btn" aria-label="历史查询">📅</button>
    <button id="btn-settings" class="icon-btn" aria-label="设置">⚙️</button>
  </div>
</header>

<main>
  <!-- Reminder Banner -->
  <div id="reminder-banner" class="reminder-banner hidden">
    <span id="reminder-text">有未填写的时段</span>
    <button id="reminder-close" class="reminder-close">✕</button>
  </div>

  <section class="date-selector today-mode">
    <span id="current-date" class="current-date">今日 (GMT)</span>
    <span id="date-full" class="date-full"></span>
  </section>

  <!-- Quick Actions -->
  <section class="quick-actions">
    <button id="btn-one-click" class="btn btn-primary btn-one-click">
      <span class="btn-icon">⚡</span>
      <span id="one-click-label">一键打卡</span>
    </button>
    <button id="btn-export-pdf" class="btn btn-outline btn-export">
      <span class="btn-icon">📄</span>
      <span>导出PDF</span>
    </button>
  </section>

  <section class="table-wrapper">
    <table id="status-table" class="status-table">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </section>

  <div class="legend">
    <span class="legend-item"><span class="color-dot" id="legend-dot"></span>超时记录</span>
    <span class="legend-item">点击单元格切换: 空→✓→✗→空</span>
    <span class="legend-item">✓ 操作后自动保存</span>
    <span class="legend-item" id="pending-count">待填写: --</span>
  </div>
</main>

<!-- Confirm Dialog -->
<div id="action-dialog" class="dialog-overlay hidden">
  <div class="dialog">
    <h3 id="dialog-title">确认</h3>
    <p id="dialog-message">确定要执行此操作吗？</p>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn btn-secondary">取消</button>
      <button id="dialog-confirm" class="btn btn-danger">确认</button>
    </div>
  </div>
</div>

<script src="app.js?v=140"></script>

<!-- PWA: Service Worker 注册 + 快捷键支持（?action=oneclick 一键打卡） -->
<script>
(function () {
  // --- Service Worker 注册（仅在 https:// 或 localhost 下生效） ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .then(function (reg) {
          // 有新版SW可用时，提示页面让新SW接管
          if (reg.waiting) { try { reg.waiting.postMessage('SKIP_WAITING'); } catch (e) {} }
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                try { nw.postMessage('SKIP_WAITING'); } catch (e) {}
                // 刷新页面以激活新版本
                window.location.reload();
              }
            });
          });
        })
        .catch(function (err) {
          console.warn('[PWA] SW registration failed (non-fatal):', err);
        });
    });

    // 新SW接管后刷新
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }

  // --- PWA Shortcut: ?action=oneclick 触发一键打卡 ---
  try {
    var q = new URLSearchParams(window.location.search || '');
    if (q.get('action') === 'oneclick') {
      // 等 app.js 完成初始化后再触发
      window.addEventListener('load', function () {
        setTimeout(function () {
          var btn = document.getElementById('btn-one-click');
          if (btn && typeof btn.click === 'function') btn.click();
        }, 600);
      });
    }
  } catch (e) { /* ignore */ }

  // --- iOS PWA standalone 模式下，修正 <a href=".html"> 不跳转到外部Safari ---
  if (('standalone' in window.navigator) && window.navigator.standalone) {
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a');
      if (!a || !a.getAttribute('href')) return;
      var href = a.getAttribute('href');
      if (href.indexOf('://') === -1 && !href.startsWith('#') && !a.target) {
        e.preventDefault();
        window.location.href = href;
      }
    }, false);
  }
})();
</script>
</body>
</html>
